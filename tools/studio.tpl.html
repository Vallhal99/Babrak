<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Babrak Studio</title>
<style>
:root{--bg:#f2f4f1;--panel:#fff;--ink:#1c2420;--mute:#5d6a63;--line:#d3dad5;--accent:#2f6f5a;--ai:#fff;--bad:#b3261e;--soft:#e5ede8;--gold:#a8770a;--cv:#cfd8d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121613;--panel:#1b221e;--ink:#e5ebe7;--mute:#97a69d;--line:#33403a;--accent:#5fb89a;--ai:#0d1a14;--bad:#f2867f;--soft:#25322b;--gold:#e0b84c;--cv:#2c3731;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:17px;margin:0 8px 0 0}
nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;min-width:0}
input[type=color]{padding:1px 3px;height:30px;width:44px}input[type=range]{padding:0}input[type=checkbox]{width:auto}
button{cursor:pointer}button:hover{border-color:var(--accent)}
button.on,button.pri{background:var(--accent);color:var(--ai);border-color:var(--accent)}
button.x{color:var(--bad)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{padding:12px 16px 40px}
.tab{display:none}.tab.on{display:block}
.split{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:5px;max-height:70vh;overflow:auto}
.li{text-align:left;display:flex;justify-content:space-between;gap:6px;padding:6px 9px}
.li small{color:var(--mute)}.li.on small{color:inherit;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin:6px 0}.row>*{flex:1 1 120px}.row>button,.row>.fit{flex:0 0 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--line);cursor:pointer;font-size:12px;user-select:none}.chip.on{background:var(--accent);color:var(--ai);border-color:var(--accent)}
.hint{color:var(--mute);font-size:12px}.badge{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--soft);color:var(--mute)}.mod{background:var(--gold);color:#fff}
canvas{background:repeating-conic-gradient(var(--cv) 0 25%,transparent 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:6px;image-rendering:pixelated;max-width:100%}
table{border-collapse:collapse;width:100%}td,th{padding:3px 4px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}td input,td select{width:100%}
.timeline{display:flex;height:22px;border-radius:5px;overflow:hidden;border:1px solid var(--line)}.timeline span{font-size:10px;overflow:hidden;white-space:nowrap;padding:0 3px;color:#fff}
.stat{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;gap:6px;align-items:center;font-size:12px}
iframe{width:100%;height:calc(100vh - 110px);border:1px solid var(--line);border-radius:8px;background:var(--bg)}
pre{background:var(--soft);padding:8px;border-radius:6px;overflow:auto;max-height:240px;font-size:12px}
.flex2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}@media(max-width:900px){.flex2{grid-template-columns:minmax(0,1fr)}}
.sheetbox{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--ai);padding:8px 16px;border-radius:99px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
</style></head><body>
<header><h1>Babrak Studio</h1>
<nav id="nav"></nav><span style="flex:1"></span>
<button id="b-save" title="Uloží projekt do prohlížeče (děje se i automaticky)">Uložit</button>
<button id="b-zip" class="pri" title="Balíček souborů, které stačí rozbalit do složky hry">Export pro hru (.zip)</button>
<button id="b-json">Projekt (.json)</button><button id="b-imp">Načíst projekt</button><button id="b-reset" class="x">Reset</button>
<input type="file" id="f-imp" accept=".json" hidden></header>
<main>
<section class="tab" id="t-chars"></section><section class="tab" id="t-anim"></section><section class="tab" id="t-enemies"></section>
<section class="tab" id="t-items"></section><section class="tab" id="t-quests"></section><section class="tab" id="t-dialogs"></section><section class="tab" id="t-help"></section>
</main><div class="toast" id="toast"></div>
<script>
"use strict";
const DATA=__DATA__;
const QUEST_TPL=__QUEST_TPL__, DIALOG_TPL=__DIALOG_TPL__;
// ===================================================== pomocné
const $=(s,r=document)=>r.querySelector(s);
function h(tag,a={},...kids){const e=document.createElement(tag);for(const k in a){const v=a[k];if(k==='class')e.className=v;else if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='value'||k==='checked'||k==='disabled'||k==='selected')e[k]=v;else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}kids.flat(9).forEach(c=>{if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c))});return e}
const R=a=>a[Math.floor(Math.random()*a.length)], rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')||'x';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
function download(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type:type||'application/octet-stream'});const a=h('a',{href:URL.createObjectURL(b),download:name});document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const hex2rgb=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255), rgb2hex=a=>'#'+a.map(v=>Math.round(clamp(v,0,1)*255).toString(16).padStart(2,'0')).join('');
function sel(opts,val,on,cls){return h('select',{class:cls,onchange:e=>on(e.target.value)},...opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return h('option',{value:v,selected:String(v)===String(val)},l)}))}
function field(l,inp){return h('label',{},l,inp)}
function num(obj,k,on,min,max,step){return h('input',{type:'number',value:obj[k]??0,min,max,step:step||1,oninput:e=>{obj[k]=parseFloat(e.target.value)||0;on&&on()}})}
function txt(obj,k,on,ph){return h('input',{value:obj[k]??'',placeholder:ph||'',oninput:e=>{obj[k]=e.target.value;on&&on()}})}
function chips(all,cur,on){const box=h('div',{class:'chips'});all.forEach(o=>{const [v,l]=Array.isArray(o)?o:[o,o];box.append(h('span',{class:'chip'+(cur.includes(v)?' on':''),onclick:()=>{const i=cur.indexOf(v);i<0?cur.push(v):cur.splice(i,1);on()}},l))});return box}
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
const IMGS={};async function img(name){if(!name)return null;if(!(name in IMGS)){const src=SHEETS[name];IMGS[name]=src?loadImg(src):Promise.resolve(null)}return IMGS[name]}
function fileToDataURL(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
function pickFiles(accept,multi,cb){const i=h('input',{type:'file',accept,multiple:multi});i.onchange=()=>cb([...i.files]);i.click()}
// ===================================================== stav projektu
const SLOTS=[[0,'Tělo (surovina)'],[1,'Zbraň'],[2,'Hlava'],[3,'Boty'],[4,'Druhá ruka'],[5,'Tělo (oblečení)'],[6,'Rukavice']];
const SLOT_ORDER=[0,'hair',5,3,6,2,4,1];   // pořadí kreslení vrstev (jako CharacterVisual.DRAW_ORDER)
const CLASSES=[['warrior','Válečník'],['ranger','Lovec'],['mage','Mág'],['rogue','Zloděj'],['chronicler','Kronikář']];
const KINDS=[['hero','Hrdina'],['companion','Společník'],['npc','NPC'],['villager','Vesničan (denní režim)'],['merchant','Obchodník']];
const WEAK=[['blade','čepel'],['blunt','drtivé'],['bow','střelné'],['fire','oheň']];
const PLACES=Object.keys(DATA.places);
const SHEETS={...DATA.sheets};           // jméno → dataURL (vestavěné cesty i vlastní nahrané)
const BODY_DEFAULT='assets/characters/hero/body/body.png', HAIR_DEFAULT='assets/characters/hero/body/hair.png', MERCH='assets/characters/merchant/merchant.png';
let P=null;
function snapshot(e){const c={...e};delete c._orig;delete c.builtin;return JSON.stringify(c)}
function mark(list,builtin){list.forEach(e=>{e.builtin=builtin;e._orig=snapshot(e)});return list}
function freshProject(){
  const items=DATA.items.map(i=>({...i}));
  const enemies=DATA.enemies.map(e=>({sheet:'',desc:'',pack:[],...e,tint:rgb2hex(e.tint)}));
  const chars=[
   {id:'hero',name:'Hrdina',kind:'hero',cls:'warrior',level:1,desc:'Hlavní postava.',dialogue:'',body:BODY_DEFAULT,hair:HAIR_DEFAULT,tint:'#ffffff',equip:{},stats:{hp:40,mana:8,atk:3,def:1,spd:8,str:5,vit:5,spi:3,agi:4},spells:['fireball'],home:'',plan:[]},
   {id:'merchant',name:'Obchodník',kind:'merchant',cls:'',level:1,desc:'Prodává zboží v hostinci.',dialogue:'merchant',body:MERCH,hair:'',tint:'#ffffff',equip:{},stats:{hp:30,mana:0,atk:1,def:1,spd:6,str:3,vit:4,spi:3,agi:3},spells:[],home:'hostinec',plan:[]},
   {id:'mira',name:'Mira',kind:'companion',cls:'mage',level:1,desc:'Mladá mágyně hledající práci.',dialogue:'mira',body:BODY_DEFAULT,hair:HAIR_DEFAULT,tint:'#c9b6ff',equip:{},stats:{hp:28,mana:20,atk:2,def:0,spd:8,str:2,vit:3,spi:7,agi:4},spells:['fireball','heal'],home:'',plan:[]},
   {id:'borek',name:'Bořek',kind:'companion',cls:'warrior',level:1,desc:'Bývalý strážný.',dialogue:'borek',body:BODY_DEFAULT,hair:HAIR_DEFAULT,tint:'#ffd6b0',equip:{},stats:{hp:50,mana:2,atk:4,def:2,spd:7,str:7,vit:6,spi:1,agi:3},spells:[],home:'',plan:[]},
   ...Object.entries(DATA.villagers).map(([id,v])=>({id,name:v.name,kind:'villager',cls:'',level:1,desc:'',dialogue:'villager_'+id,body:v.sheet.replace('res://',''),hair:'',tint:rgb2hex(v.tint),equip:{},stats:{hp:20,mana:0,atk:1,def:0,spd:6,str:3,vit:3,spi:3,agi:3},spells:[],home:v.home,plan:v.plan.map(p=>({h:p.h,at:p.at,act:p.act||'',in:!!p.in}))}))];
  return {items:mark(items,true),enemies:mark(enemies,true),chars:mark(chars,true),anims:JSON.parse(JSON.stringify(DATA.anims)),ui:{},userSheets:{}};
}
function loadProject(){
  P=freshProject();
  try{const raw=localStorage.getItem('babrak-studio');if(raw){const s=JSON.parse(raw);
    for(const k of ['items','enemies','chars']){const byId=Object.fromEntries(P[k].map(e=>[e.id,e]));s[k].forEach(e=>{const b=byId[e.id];if(b){const orig=b._orig;Object.assign(b,e);b._orig=orig;b.builtin=true}else{e.builtin=false;e._orig='';P[k].push(e)}})}
    if(s.anims)P.anims=s.anims;P.userSheets=s.userSheets||{};Object.assign(SHEETS,P.userSheets);P.saved=s;if(s.dialogQuests)P.saved.quests=P.saved.quests||s.dialogQuests}}catch(e){}
}
function saveProject(quiet){
  try{const out={items:P.items.map(strip),enemies:P.enemies.map(strip),chars:P.chars.map(strip),anims:P.anims,userSheets:P.userSheets,ver:1,...(typeof frameState==='function'?frameState():{})};
    localStorage.setItem('babrak-studio',JSON.stringify(out));if(!quiet)toast('Uloženo v prohlížeči')}catch(e){if(!quiet)toast('Uložení do prohlížeče selhalo (velikost?)')}
}
function strip(e){const c={...e};delete c._orig;delete c.builtin;return c}
let saveT;function touch(){clearTimeout(saveT);saveT=setTimeout(()=>saveProject(true),600)}
const dirty=e=>!e.builtin||snapshot(e)!==e._orig;
// ===================================================== animace: geometrie a vykreslení
function animRect(A,anim,dir,frame,big){const d=A[anim];const dd=(d.dirs??4)>1?dir:0;return big?[frame*192,3968+(d.big_row+dd)*192,192,192]:[frame*64,(d.row+dd)*64,64,64]}
function animFrame(def,t){const n=def.frames,f=Math.floor(t*def.fps);return def.loop?f%n:Math.min(f,n-1)}
const DIAG={walk:'walk_diag',run:'run_diag'};
function resolveAnim(A,anim,dir){if(dir<4)return[anim,dir];if(DIAG[anim]&&A[DIAG[anim]])return[DIAG[anim],dir-4];return[anim,(dir===4||dir===5)?0:2]}
const DIRNAMES=['nahoru','vlevo','dolů','vpravo','↖','↗','↙','↘'];
/** Vykreslí postavu z vrstev; fig = {body,hair,tint,equip:{slot:itemId}} */
async function drawFigure(ctx,fig,animName,dir,t,scale,opts={}){
  const A=P.anims;const [an,dr]=resolveAnim(A,animName,dir);const def=A[an];if(!def)return;const fr=opts.frame!=null?opts.frame:animFrame(def,t);
  const W=64*scale;const cv=ctx.canvas;if(!opts.keep){ctx.clearRect(0,0,cv.width,cv.height)}
  const tmp=document.createElement('canvas');tmp.width=192;tmp.height=192;const tc=tmp.getContext('2d');tc.imageSmoothingEnabled=false;
  const eq=fig.equip||{};const items=P.items;const itemOf=s=>{const id=eq[s];return id&&items.find(i=>i.id===id)};
  const hides=Object.values(eq).some(id=>{const i=items.find(x=>x.id===id);return i&&i.hides_hair});
  const bigSlot=[];
  for(const slot of SLOT_ORDER){
    let name=null,big=false;
    if(slot===0)name=fig.body;else if(slot==='hair'){if(!hides)name=fig.hair}else{const it=itemOf(slot);if(it){name=it.layer;big=(it.big_anims||[]).includes(an)&&def.big_row!=null}}
    const im=await img(name);if(!im)continue;
    if(slot===0||slot==='hair'){const[ sx,sy,sw,sh]=animRect(A,an,dr,fr,false);if(sy+sh<=im.height)tc.drawImage(im,sx,sy,sw,sh,64,64,64,64)}
    else if(big&&im.height>3968){const[sx,sy,sw,sh]=animRect(A,an,dr,fr,true);tc.drawImage(im,sx,sy,sw,sh,0,0,192,192)}
    else{const[sx,sy,sw,sh]=animRect(A,an,dr,fr,false);if(sy+sh<=im.height)tc.drawImage(im,sx,sy,sw,sh,64,64,64,64)}
  }
  if(fig.tint&&fig.tint.toLowerCase()!=='#ffffff'){const t2=document.createElement('canvas');t2.width=192;t2.height=192;const c2=t2.getContext('2d');c2.drawImage(tmp,0,0);c2.globalCompositeOperation='multiply';c2.fillStyle=fig.tint;c2.fillRect(0,0,192,192);c2.globalCompositeOperation='destination-in';c2.drawImage(tmp,0,0);tc.clearRect(0,0,192,192);tc.drawImage(t2,0,0)}
  ctx.imageSmoothingEnabled=false;const ox=opts.ox??(cv.width-192*scale)/2,oy=opts.oy??(cv.height-192*scale)/2;
  ctx.drawImage(tmp,0,0,192,192,ox,oy,192*scale,192*scale);
}
/** Přehrávač: canvas + ovládání animací; vrací {el,setFig,stop} */
function player(getFig,opts={}){
  const st={anim:opts.anim||'idle',dir:2,playing:true,speed:1,t:0,frame:null,scale:opts.scale||3,onion:false};
  const cv=h('canvas',{width:opts.w||384,height:opts.h||384});const ctx=cv.getContext('2d');
  let last=performance.now(),raf;
  const info=h('span',{class:'hint'});
  async function tick(now){raf=requestAnimationFrame(tick);if(!cv.isConnected)return;const dt=(now-last)/1000;last=now;if(st.playing)st.t+=dt*st.speed;
    const def=P.anims[resolveAnim(P.anims,st.anim,st.dir)[0]];if(!def)return;const f=st.frame!=null?st.frame:animFrame(def,st.t);
    if(st.busy)return;st.busy=true;try{await drawFigure(ctx,getFig(),st.anim,st.dir,st.t,st.scale,{frame:f});
      if(st.onion&&f>0){ctx.globalAlpha=.3;await drawFigure(ctx,getFig(),st.anim,st.dir,st.t,st.scale,{frame:f-1,keep:true});ctx.globalAlpha=1}
      info.textContent=`${st.anim} · směr ${DIRNAMES[st.dir]} · snímek ${f+1}/${def.frames} · ${def.fps} fps`+(def.hit_frame!=null&&def.hit_frame===f?' · ZÁSAH':'')}finally{st.busy=false}}
  raf=requestAnimationFrame(tick);
  const animSel=h('select',{onchange:e=>{st.anim=e.target.value;st.t=0}});
  const fill=()=>{animSel.replaceChildren(...Object.keys(P.anims).map(a=>h('option',{value:a,selected:a===st.anim},a)))};fill();
  const dirs=h('div',{class:'row'},...DIRNAMES.map((n,i)=>h('button',{class:i===2?'on':'',onclick:e=>{st.dir=i;[...e.target.parentNode.children].forEach((b,j)=>b.classList.toggle('on',j===i))}},n)));
  const ctl=h('div',{class:'row'},field('Animace',animSel),
    h('button',{onclick:e=>{st.playing=!st.playing;e.target.textContent=st.playing?'⏸':'▶'}},'⏸'),
    h('button',{onclick:()=>{st.playing=false;st.frame=((st.frame??0)+1)%P.anims[resolveAnim(P.anims,st.anim,st.dir)[0]].frames}},'⏭ snímek'),
    h('button',{onclick:()=>{st.frame=null;st.playing=true}},'volný běh'),
    field('Rychlost',h('input',{type:'range',min:.2,max:2,step:.1,value:1,oninput:e=>st.speed=+e.target.value})),
    field('Zvětšení',h('input',{type:'range',min:1,max:4,step:1,value:st.scale,oninput:e=>st.scale=+e.target.value})),
    h('label',{style:{flexDirection:'row',alignItems:'center',gap:'4px'}},h('input',{type:'checkbox',onchange:e=>st.onion=e.target.checked}),'předchozí snímek'));
  return {el:h('div',{},cv,info,ctl,dirs),st,refresh:fill};
}
// ===================================================== generátory (jména, náhoda)
const NAMES={m:['Bořek','Tomáš','Jakub','Matěj','Vilém','Radim','Ondřej','Zdeněk','Havel','Kryštof','Mikuláš','Přemysl'],f:['Hana','Eliška','Mira','Anežka','Dagmar','Lenka','Božena','Rút','Klára','Vlasta','Zuzana','Ludmila']};
const EPI=['Zrzavý','Černý','Starý','Rychlý','Tichý','z Lipové','od Brodu','Zlatý','Jednooký','Statečný','Mrzutý','Zelený'];
const JOBS=['kovář','pekař','rybář','bylinkář','lovec','písař','mlynář','strážný','hospodský','pastýř','tulák','kejklíř'];
function randName(){const f=Math.random()<.5;return R(NAMES[f?'f':'m'])+(Math.random()<.5?' '+R(EPI).replace(/^(Zrzavý|Černý|Starý|Rychlý|Tichý|Zlatý|Jednooký|Statečný|Mrzutý|Zelený)$/,f?'$1':'$1'):'')}
const CLASS_STATS={warrior:{hp:50,mana:2,atk:4,def:2,spd:7,str:7,vit:6,spi:1,agi:3},ranger:{hp:38,mana:6,atk:4,def:1,spd:9,str:4,vit:4,spi:2,agi:7},mage:{hp:28,mana:22,atk:2,def:0,spd:8,str:2,vit:3,spi:8,agi:4},rogue:{hp:34,mana:6,atk:3,def:1,spd:11,str:3,vit:3,spi:3,agi:8},chronicler:{hp:32,mana:14,atk:2,def:1,spd:8,str:3,vit:4,spi:6,agi:5}};
function randomChar(){
  const kind=R(['companion','villager','npc','villager']);const cls=kind==='companion'?R(CLASSES)[0]:'';
  const base=cls?CLASS_STATS[cls]:{hp:20,mana:0,atk:1,def:0,spd:6,str:3,vit:3,spi:3,agi:3};
  const stats={};for(const k in base)stats[k]=Math.max(0,base[k]+rnd(-2,3));

  const exp=h('div',{class:'card'},h('h2',{},'Export'),h('div',{class:'row'},h('button',{onclick:()=>download(it.id+'.tres',itemTres(it))},'Stáhnout .tres'),it.icon?h('button',{onclick:async()=>download(it.id+'.png',await (await fetch(it.icon)).blob())},'Stáhnout ikonu'):''),h('pre',{},itemTres(it)));
  const cmp=h('div',{class:'card'},h('h2',{},'Srovnání se stejným slotem'),h('table',{},h('tr',{},...['Předmět','Útok','Obrana','Zdraví','Cena'].map(x=>h('th',{},x))),...P.items.filter(i=>i.slot===it.slot).map(i=>h('tr',{},h('td',{},i.id===it.id?h('b',{},i.name):i.name),h('td',{},i.damage),h('td',{},i.defense),h('td',{},i.hp),h('td',{},i.price)))));
  root.append(h('div',{class:'split'},left,h('div',{class:'flex2'},h('div',{},h('div',{class:'card'},h('h2',{},'Náhled na postavě'),fig.el),cmp),h('div',{},form,vis,exp))));
}
async function recolor(layerName,hue,id){const im=await img(layerName);const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.filter=`hue-rotate(${hue}deg)`;x.drawImage(im,0,0);const name='user/item_'+id;const url=c.toDataURL();SHEETS[name]=url;delete IMGS[name];P.userSheets[name]=url;return name}
function itemTres(it){const L=['[gd_resource type="Resource" script_class="ItemData" load_steps=4 format=3]','','[ext_resource type="Script" path="res://scripts/data/item_data.gd" id="1"]'];
  const iconPath=it.icon&&!it.icon_path?`res://assets/icons/${it.id}.png`:it.icon_path?'res://'+it.icon_path:'';if(iconPath)L.push(`[ext_resource type="Texture2D" path="${iconPath}" id="2"]`);
  const layerPath=it.layer?(it.layer.startsWith('user/')?`res://assets/characters/items/${it.id}.png`:'res://'+it.layer):'';if(layerPath)L.push(`[ext_resource type="Texture2D" path="${layerPath}" id="3"]`);
  L.push('','[resource]','script = ExtResource("1")',`id = &"${it.id}"`,`display_name = "${it.name.replace(/"/g,'\\"')}"`,`description = "${(it.desc||'').replace(/"/g,'\\"').replace(/\n/g,' ')}"`);
  if(iconPath)L.push('icon = ExtResource("2")');L.push(`slot = ${it.slot}`,`price = ${it.price}`);if(layerPath)L.push('layer_sheet = ExtResource("3")');
  if(it.big_anims&&it.big_anims.length)L.push('big_anims = Array[StringName]([&"'+it.big_anims.join('", &"')+'"])');if(it.hides_hair)L.push('hides_hair = true');if(it.stance)L.push(`stance = &"${it.stance}"`);
  if(it.light)L.push(`light = ${Number(it.light).toFixed(1)}`);if(it.damage)L.push(`damage = ${it.damage}`);if(it.defense)L.push(`defense = ${it.defense}`);if(it.hp)L.push(`max_hp = ${it.hp}`);if(it.mp)L.push(`max_mana = ${it.mp}`);
  if(it.attack_anim&&it.attack_anim!=='slash')L.push(`attack_anim = &"${it.attack_anim}"`);if(it.ranged)L.push('ranged = true');return L.join('\n')+'\n'}
// ===================================================== záložky: Questy a Dialogy (vložené editory)
const FRAMES={};
function frameTab(id,html,key){const root=$('#'+id);if(!FRAMES[key]){const f=h('iframe',{});f.srcdoc=html;FRAMES[key]=f}root.replaceChildren(FRAMES[key])}
function questFrameHtml(){const d={quests:(P.saved&&P.saved.quests)||DATA.quests,enemies:P.enemies.map(e=>e.id),npcs:P.chars.filter(c=>c.kind!=='hero').map(c=>c.id),items:P.items.map(i=>i.id)};return QUEST_TPL.replace('__DA'+'TA__',()=>JSON.stringify(d))}
function dialogFrameHtml(){const D=(P.saved&&P.saved.dialogues)||DATA.dialogues;const Q=(P.saved&&P.saved.quests)||DATA.quests;return DIALOG_TPL.replace('__DIALOGUES__',()=>JSON.stringify(D)).replace('__QUESTS__',()=>JSON.stringify(Q))}
function renderQuests(){frameTab('t-quests',questFrameHtml(),'q')}
function renderDialogs(){frameTab('t-dialogs',dialogFrameHtml(),'d')}
function frameState(){const o={};try{if(FRAMES.q)o.quests=FRAMES.q.contentWindow.eval('Q')}catch(e){}try{if(FRAMES.d){const S=FRAMES.d.contentWindow.eval('S');o.dialogues=S.dialogues;o.dialogQuests=S.quests}}catch(e){}return o}
// ===================================================== ZIP (bez komprese) + export
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=~0;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(~c)>>>0}
function makeZip(files){const enc=new TextEncoder();const parts=[],cen=[];let off=0;
  for(const f of files){const nm=enc.encode(f.path),d=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x800,true);lh.setUint32(14,crc,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nm.length,true);
    parts.push(lh.buffer,nm,d);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x800,true);ch.setUint32(16,crc,true);ch.setUint32(20,d.length,true);ch.setUint32(24,d.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,nm);off+=30+nm.length+d.length}
  const csz=cen.reduce((a,b)=>a+(b.byteLength??b.length),0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:'application/zip'})}
function buildFiles(){
  const F=[];const fs=frameState();
  P.items.filter(dirty).forEach(it=>{F.push({path:`data/items/${it.id}.tres`,data:itemTres(it)});if(it.icon&&it.icon.startsWith('data:')&&(!it.builtin||it.icon!==(DATA.items.find(x=>x.id===it.id)||{}).icon))F.push({path:`assets/icons/${it.id}.png`,data:dataURLtoBytes(it.icon)});
    if(it.layer&&it.layer.startsWith('user/'))F.push({path:`assets/characters/items/${it.id}.png`,data:dataURLtoBytes(SHEETS[it.layer])})});
  P.enemies.filter(dirty).forEach(e=>{const x=exportEnemy(e);F.push({path:x.path,data:x.data});if(e.sheet&&e.sheet.startsWith('user/'))F.push({path:`assets/characters/${e.id}/body.png`,data:dataURLtoBytes(SHEETS[e.sheet])})});
  P.chars.filter(dirty).forEach(c=>{const x=exportChar(c);F.push({path:x.path,data:x.data});if(c.body.startsWith('user/'))F.push({path:`assets/characters/${c.id}/body.png`,data:dataURLtoBytes(SHEETS[c.body])})});
  Object.keys(P.userSheets).filter(n=>/^user\/sheet_/.test(n)).forEach(n=>F.push({path:`assets/characters/custom/${n.slice(5)}.png`,data:dataURLtoBytes(P.userSheets[n])}));
  if(fs.quests)F.push({path:'data/quests/main.json',data:JSON.stringify(fs.quests,null,1)});
  if(fs.dialogues)Object.entries(fs.dialogues).forEach(([id,d])=>{const o={...d};delete o.id;F.push({path:`data/dialogues/${id}.json`,data:JSON.stringify(o,null,1)})});
  F.push({path:'README_STUDIO.txt',data:'Babrak Studio – export.\nRozbal celý obsah ZIPu do kořene projektu (složka s project.godot), přepiš soubory.\nPak spusť Godot: --headless --import --path . (nebo otevři projekt v editoru).\nNepřátelé z data/enemies a vesničané z data/villagers se načtou automaticky.\n'});
  return F}

function renderHelp(){$('#t-help').replaceChildren(h('div',{class:'card'},h('h2',{},'Babrak Studio – jak to funguje'),
  h('p',{},'Vše se ukládá automaticky v prohlížeči. Tlačítko „Export pro hru (.zip)“ zabalí jen to, co je nové nebo upravené; rozbal jej do kořene projektu.'),
  h('ul',{},h('li',{},h('b',{},'Postavy'),' – vzhled, vrstvy výbavy, statistiky, denní režim vesničanů, 🎲 náhodná postava.'),
   h('li',{},h('b',{},'Animace'),' – vlož vlastní snímky (PNG) pro chůzi, běh, boj…, nebo z jednoho obrázku vygeneruj celý sheet 832×3968.'),
   h('li',{},h('b',{},'Nepřátelé'),' – všechny parametry šablony, odhad obtížnosti, 🎲 náhodný nepřítel (téma, úroveň, rank).'),
   h('li',{},h('b',{},'Předměty'),' – statistiky, pixelová ikona, vrstva na postavě, překolorování, 🎲 náhodný předmět.'),
   h('li',{},h('b',{},'Questy / Dialogy'),' – vložené editory, jejich stav se exportuje společně.')),
  h('p',{},'Formáty: data/items/*.tres, data/enemies/*.json, data/villagers/*.json, data/quests/main.json, data/dialogues/*.json.'),
  h('p',{class:'hint'},'Limit hry: najednou lze vykreslit max. 19 postav (každá má vlastní vrstvu viditelnosti).')))}
// ===================================================== navigace a boot
const TABS=[['chars','Postavy',renderChars],['anim','Animace',renderAnim],['enemies','Nepřátelé',renderEnemies],['items','Předměty',renderItems],['quests','Questy',renderQuests],['dialogs','Dialogy',renderDialogs],['help','Nápověda',renderHelp]];
let curTab='chars';
function switchTab(k){curTab=k;try{localStorage.setItem('babrak-tab',k)}catch(e){}
  TABS.forEach(([id])=>{$('#t-'+id).classList.toggle('on',id===k);$('#nav').querySelector('[data-t='+id+']').classList.toggle('on',id===k)});
  TABS.find(t=>t[0]===k)[2]()}
function boot(){loadProject();
  $('#nav').append(...TABS.map(([id,l])=>h('button',{'data-t':id,onclick:()=>switchTab(id)},l)));
  $('#b-save').onclick=()=>saveProject();
  $('#b-zip').onclick=()=>{try{const F=buildFiles();download('babrak_studio_export.zip',makeZip(F));toast('ZIP: '+F.length+' souborů')}catch(e){toast('Export selhal: '+e.message)}};
  $('#b-json').onclick=()=>{saveProject(true);const o=JSON.parse(localStorage.getItem('babrak-studio')||'{}');Object.assign(o,frameState());download('babrak_projekt.json',JSON.stringify(o))};
  $('#b-imp').onclick=()=>$('#f-imp').click();
  $('#f-imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());localStorage.setItem('babrak-studio',JSON.stringify(o));location.reload()}catch(x){toast('Neplatný soubor')}};
  $('#b-reset').onclick=()=>{if(confirm('Smazat všechny změny a vrátit původní data hry?')){try{localStorage.removeItem('babrak-studio')}catch(e){}location.reload()}};
  let t='chars';try{t=localStorage.getItem('babrak-tab')||'chars'}catch(e){}if(!TABS.some(x=>x[0]===t))t='chars';switchTab(t)}
boot();
